<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios | Gas El Volcán</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="cuerpo-admin">

    <a class="salto-contenido" href="#contenidoAdmin">
        Saltar al contenido
    </a>


    <div class="admin-layout">

        <!-- ==============================
             MENÚ LATERAL
        =============================== -->
        <aside class="admin-menu">

            <a class="admin-marca" href="../index.html">

                <img src="../img/logo.svg" alt="Logo de Gas El Volcán">

                <span>
                    Gas El Volcán
                </span>

            </a>


            <nav aria-label="Menú del panel">

                <ul class="admin-lista" id="menuAdmin"></ul>

            </nav>


            <!-- USUARIO CONECTADO -->
            <div class="admin-usuario">

                <p class="admin-usuario-nombre" id="usuarioNombre"></p>

                <p class="admin-usuario-rol" id="usuarioRol"></p>

                <button type="button" class="btn btn-salir" id="botonSalir">
                    Cerrar sesión
                </button>

            </div>

        </aside>


        <!-- ==============================
             CONTENIDO
        =============================== -->
        <main class="admin-contenido" id="contenidoAdmin">

            <!-- ENCABEZADO -->
            <header class="admin-encabezado">

                <div>

                    <p class="admin-etiqueta">
                        Administración
                    </p>

                    <h1 id="saludoAdmin">
                        Gestión de usuarios
                    </h1>

                </div>


                <button type="button" class="btn btn-principal" id="btnNuevoUsuario">
                    + Crear usuario
                </button>

            </header>


            <!-- AVISO -->
            <section class="admin-aviso" aria-labelledby="tituloAviso">

                <h2 id="tituloAviso">
                    Gestión de usuarios
                </h2>

                <p id="textoAviso">
                    Desde aquí puedes crear, editar,
                    desactivar usuarios y asignar roles.
                </p>

            </section>


            <!-- TABLA DE USUARIOS -->
            <section class="mt-4">

                <div class="tabla-contenedor">

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>

                                <tr>

                                    <th>
                                        Nombre
                                    </th>

                                    <th>
                                        Correo
                                    </th>

                                    <th>
                                        Rol
                                    </th>

                                    <th>
                                        Estado
                                    </th>

                                    <th>
                                        Acciones
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="tablaUsuarios">

                                <!--
                                    JavaScript cargará
                                    aquí los usuarios.
                                -->

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- ==================================
         MODAL CREAR / EDITAR USUARIO
    =================================== -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloModalUsuario" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5" id="tituloModalUsuario">
                        Crear usuario
                    </h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>

                </div>


                <form id="formUsuario">

                    <div class="modal-body">

                        <!-- ID -->
                        <input type="hidden" id="usuarioId">


                        <!-- NOMBRE -->
                        <div class="mb-3">

                            <label for="nombreUsuario" class="form-label">
                                Nombre
                            </label>

                            <input type="text" class="form-control" id="nombreUsuario" maxlength="50" required>

                            <div class="text-danger mt-1" id="errorNombre"></div>

                        </div>


                        <!-- CORREO -->
                        <div class="mb-3">

                            <label for="correoUsuario" class="form-label">
                                Correo
                            </label>

                            <input type="email" class="form-control" id="correoUsuario" maxlength="100" required>

                            <div class="text-danger mt-1" id="errorCorreo"></div>

                        </div>


                        <!-- CONTRASEÑA -->
                        <div class="mb-3">

                            <label for="contrasenaUsuario" class="form-label">
                                Contraseña
                            </label>

                            <input type="password" class="form-control" id="contrasenaUsuario" minlength="4"
                                maxlength="10" required>

                            <div class="text-danger mt-1" id="errorContrasena"></div>

                        </div>


                        <!-- ROL -->
                        <div class="mb-3">

                            <label for="rolUsuarioForm" class="form-label">
                                Rol
                            </label>

                            <select class="form-select" id="rolUsuarioForm" required>

                                <option value="">
                                    Selecciona un rol
                                </option>

                                <option value="REPARTIDOR">
                                    Repartidor
                                </option>

                                <option value="DESPACHADORA">
                                    Operadora / Despachadora
                                </option>

                                <option value="CLIENTE">
                                    Cliente
                                </option>

                            </select>

                            <div class="text-danger mt-1" id="errorRol"></div>

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-principal">
                            Guardar usuario
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/sesion.js"></script>
    <script src="../js/admin.js"></script>

    <!-- LO CREAREMOS DESPUÉS -->
    <script src="../js/usuarios.js"></script>

</body>

</html>
