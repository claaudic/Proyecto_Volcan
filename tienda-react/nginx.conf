# nginx dentro del contenedor "frontend" (ver Dockerfile).

server {
    listen 80;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad para todas las respuestas.
    # CSP: el navegador solo ejecuta scripts de esta misma direccion (frena un XSS
    # que intente cargar codigo de otro sitio para robar el token). Las fuentes
    # vienen de Google Fonts y las llamadas a la API van a /api (misma direccion).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API: se la pasa al Gateway (nombre del contenedor en docker-compose).
    # El navegador ve todo en la misma direccion, asi que no hay problemas de CORS.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de React (/admin, /perfil, ...): no son archivos, asi que se
    # entrega index.html y React Router muestra la pagina. Sin esto, recargar da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
